<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OT Calculate">
<title>OT Calculate</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
background:#f5f5f7;
color:#111;
font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif
}
.app{
max-width:560px;
margin:auto;
min-height:100vh;
padding:45px 20px 30px
}
h1{
font-size:34px;
margin:0;
font-weight:800
}
.sub{
color:#777;
margin:5px 0 25px
}
.card{
background:white;
border-radius:22px;
padding:20px;
margin-bottom:16px;
box-shadow:0 8px 30px rgba(0,0,0,.06)
}
label{
display:block;
font-size:13px;
font-weight:700;
color:#666;
margin-bottom:8px
}
input,select{
width:100%;
height:52px;
border:1px solid #ddd;
border-radius:14px;
background:#fafafa;
padding:0 15px;
font-size:18px;
margin-bottom:18px;
outline:none
}
button{
width:100%;
height:54px;
border:0;
border-radius:15px;
background:#111;
color:white;
font-size:17px;
font-weight:700
}
.clear{
background:#eee;
color:#111;
margin-top:10px
}
.result{
display:none
}
.small{
font-size:13px;
color:#777;
font-weight:700
}
.rate{
font-size:28px;
font-weight:800;
margin:5px 0 20px
}
.total{
font-size:38px;
font-weight:800;
margin-top:4px
}
.formula{
text-align:center;
font-size:12px;
color:#888;
line-height:1.5
}
</style>
</head>

<body>

<div class="app">

<h1>OT Calculate</h1>
<div class="sub">Saudi overtime calculator</div>

<div class="card">

<label>Basic Salary (SAR)</label>
<input id="salary"
type="number"
inputmode="decimal"
placeholder="10,000">

<label>OT Multiplier</label>
<select id="multiplier">
<option value="1.5">1.5×</option>
<option value="2">2×</option>
<option value="2.5">2.5×</option>
<option value="3">3×</option>
<option value="custom">Custom</option>
</select>

<input id="custom"
type="number"
inputmode="decimal"
step="0.1"
placeholder="Enter multiplier"
style="display:none">

<label>OT Hours</label>
<input id="hours"
type="number"
inputmode="decimal"
step="0.5"
placeholder="20">

<button onclick="calculate()">CALCULATE</button>

<button class="clear" onclick="clearAll()">CLEAR</button>

</div>

<div class="card result" id="result">

<div class="small">OT RATE</div>

<div class="rate" id="rate">
0.00 SAR / hour
</div>

<div class="small">TOTAL OT</div>

<div class="total" id="total">
0.00 SAR
</div>

</div>

<div class="formula">
Basic Salary ÷ 240 × OT Multiplier
<br>
Last values are saved automatically.
</div>

</div>

<script>

const salary=document.getElementById("salary");
const multiplier=document.getElementById("multiplier");
const custom=document.getElementById("custom");
const hours=document.getElementById("hours");
const result=document.getElementById("result");
const rate=document.getElementById("rate");
const total=document.getElementById("total");

function save(){

localStorage.setItem("salary",salary.value);
localStorage.setItem("multiplier",multiplier.value);
localStorage.setItem("custom",custom.value);
localStorage.setItem("hours",hours.value);

}

function load(){

salary.value=localStorage.getItem("salary")||"";
multiplier.value=localStorage.getItem("multiplier")||"1.5";
custom.value=localStorage.getItem("custom")||"";
hours.value=localStorage.getItem("hours")||"";

custom.style.display=
multiplier.value==="custom" ? "block":"none";

}

function calculate(){

const s=parseFloat(salary.value);
const h=parseFloat(hours.value);

let m;

if(multiplier.value==="custom"){
m=parseFloat(custom.value);
}else{
m=parseFloat(multiplier.value);
}

if(!Number.isFinite(s) ||
!Number.isFinite(h) ||
!Number.isFinite(m)){
return;
}

const hourly=(s/240)*m;
const overtime=hourly*h;

rate.textContent=
hourly.toFixed(2)+" SAR / hour";

total.textContent=
overtime.toFixed(2)+" SAR";

result.style.display="block";

save();

}

function clearAll(){

salary.value="";
multiplier.value="1.5";
custom.value="";
hours.value="";

custom.style.display="none";
result.style.display="none";

localStorage.clear();

}

multiplier.addEventListener("change",function(){

custom.style.display=
this.value==="custom" ? "block":"none";

save();

});

[salary,custom,hours].forEach(function(x){

x.addEventListener("input",save);

});

load();

</script>

</body>
</html>
