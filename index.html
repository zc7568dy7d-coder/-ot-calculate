<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111"><meta name="apple-mobile-web-app-capable" content="yes">
<title>OT Calculate</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
.app{max-width:560px;margin:auto;min-height:100vh;padding:28px 18px}.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
h1{margin:0;font-size:32px}.sub{color:#777;margin-top:4px;font-size:14px}
.card{background:#fff;border-radius:22px;padding:19px;margin-bottom:15px;box-shadow:0 8px 30px #0000000d}
label{display:block;font-size:13px;font-weight:750;color:#666;margin-bottom:7px}
input,select{width:100%;height:51px;border:1px solid #ddd;border-radius:14px;background:#fafafa;padding:0 14px;font-size:18px;margin-bottom:16px}
button{width:100%;height:53px;border:0;border-radius:15px;background:#111;color:#fff;font-size:16px;font-weight:800}
.secondary{background:#eee;color:#111;margin-top:9px}.small{font-size:12px;color:#888}.rate{font-size:28px;font-weight:850;margin:4px 0 17px}.total{font-size:38px;font-weight:850}
.result{display:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.top button,.actions button{height:42px;background:#fff;color:#111;border:1px solid #ddd;font-size:13px}.history h2{font-size:18px;margin:0 0 10px}
.item{padding:11px 0;border-bottom:1px solid #eee}.item:last-child{border:0}.line{display:flex;justify-content:space-between;font-weight:750}.detail{font-size:12px;color:#777;margin-top:4px}
.formula{text-align:center;font-size:12px;color:#888;line-height:1.5;margin:15px}
.modal{display:none;position:fixed;inset:0;background:#0007;padding:20px}.box{background:#fff;border-radius:22px;padding:22px;margin-top:18vh}.box button{margin-top:10px}
.rtl{direction:rtl;text-align:right}
</style></head><body><main class="app" id="app">
<header class="top"><div><h1>OT Calculate</h1><div class="sub" id="sub">Saudi overtime calculator</div></div><button id="lang" style="width:auto;padding:0 13px">العربية</button></header>

<section class="card">
<label id="ls">Basic Salary (SAR)</label><input id="salary" type="number" inputmode="decimal" min="0" step=".01" placeholder="10,000">
<label id="lm">OT Multiplier</label><select id="mult"><option>1.5</option><option>2</option><option>2.5</option><option>3</option><option value="custom">Custom</option></select>
<input id="custom" type="number" inputmode="decimal" step=".1" placeholder="Enter multiplier" style="display:none">
<label id="ld">OT Duration</label><input id="hrs" type="number" inputmode="decimal" min="0" step="0.5" placeholder="Hours">
<button id="calc">CALCULATE</button><button id="clear" class="secondary">CLEAR</button>
</section>

<section class="card result" id="result">
<div class="small" id="lr">OT RATE</div><div class="rate" id="rate">0.00 SAR / hour</div>
<div class="small" id="lt">TOTAL OT</div><div class="total" id="total">0.00 SAR</div>
<div class="actions"><button id="share">SHARE RESULT</button><button id="home">ADD TO HOME SCREEN</button></div>
</section>

<section class="card"><h2 id="lh">History</h2><div id="history">No calculations yet.</div><button id="clearHistory" class="secondary">CLEAR HISTORY</button></section>
<div class="formula" id="formula">Formula: Basic Salary ÷ 240 × OT Multiplier.<br>Last values are saved on this device.</div>
</main>

<div class="modal" id="modal"><div class="box"><h2 id="mt">Add to Home Screen</h2><p id="mp">In Safari, tap Share, then choose “Add to Home Screen”.</p><button onclick="modal.style.display='none'">OK</button></div></div>

<script>
const $=id=>document.getElementById(id);let ar=localStorage.lang==='ar',promptEvent=null;
const text={en:{sub:'Saudi overtime calculator',s:'Basic Salary (SAR)',m:'OT Multiplier',d:'OT Duration',calc:'CALCULATE',clear:'CLEAR',rate:'OT RATE',total:'TOTAL OT',share:'SHARE RESULT',home:'ADD TO HOME SCREEN',hist:'History',ch:'CLEAR HISTORY',empty:'No calculations yet.',formula:'Formula: Basic Salary ÷ 240 × OT Multiplier.<br>Last values are saved on this device.',mt:'Add to Home Screen',mp:'In Safari, tap Share, then choose “Add to Home Screen”.'},
ar:{sub:'حاسبة الأوفر تايم السعودية',s:'الراتب الأساسي (ريال)',m:'معامل الأوفر تايم',d:'مدة الأوفر تايم',calc:'احسب',clear:'مسح',rate:'قيمة ساعة الأوفر تايم',total:'إجمالي الأوفر تايم',share:'مشاركة النتيجة',home:'إضافة للشاشة الرئيسية',hist:'السجل',ch:'مسح السجل',empty:'لا توجد حسبة حتى الآن.',formula:'الحسبة: الراتب الأساسي ÷ 240 × معامل الأوفر تايم.<br>يتم حفظ البيانات على هذا الجهاز.',mt:'إضافة للشاشة الرئيسية',mp:'في Safari اضغط مشاركة ثم اختر إضافة إلى الشاشة الرئيسية.'}};
function lang(){let t=ar?text.ar:text.en;$('app').className='app '+(ar?'rtl':'');$('sub').textContent=t.sub;$('ls').textContent=t.s;$('lm').textContent=t.m;$('ld').textContent=t.d;$('calc').textContent=t.calc;$('clear').textContent=t.clear;$('lr').textContent=t.rate;$('lt').textContent=t.total;$('share').textContent=t.share;$('home').textContent=t.home;$('lh').textContent=t.hist;$('clearHistory').textContent=t.ch;$('formula').innerHTML=t.formula;$('lang').textContent=ar?'English':'العربية';$('mt').textContent=t.mt;$('mp').textContent=t.mp;render()}
function save(){['salary','mult','custom','hrs'].forEach(id=>localStorage[id]=$(id).value)}
function load(){['salary','mult','custom','hrs'].forEach(id=>$(id).value=localStorage[id]||'');toggle()}
function toggle(){$('custom').style.display=$('mult').value==='custom'?'block':'none'}
function render(){let h=JSON.parse(localStorage.history||'[]');$('history').innerHTML=h.length?h.map(x=>`<div class=item><div class=line><span>${x.total.toFixed(2)} SAR</span><span>${x.mult}×</span></div><div class=detail>${x.salary.toFixed(2)} SAR · ${x.h}h · ${x.date}</div></div>`).join(''):text[ar].empty}
function calc(){let s=+$('salary').value,m=$('mult').value==='custom'?+$('custom').value:+$('mult').value,h=Math.max(0,+$('hrs').value||0);if(!isFinite(s)||!isFinite(m)||s<0||m<0)return;let rate=s/240*m,total=rate*h;$('rate').textContent=rate.toFixed(2)+' SAR / hour';$('total').textContent=total.toFixed(2)+' SAR';$('result').style.display='block';save();let a=JSON.parse(localStorage.history||'[]');a.unshift({salary:s,mult:m,h,total,date:new Date().toLocaleString()});localStorage.history=JSON.stringify(a.slice(0,10));render()}
function clearAll(){['salary','custom','hrs'].forEach(id=>$(id).value='');$('mult').value='1.5';$('result').style.display='none';['salary','mult','custom','hrs'].forEach(id=>localStorage.removeItem(id));toggle()}
$('mult').onchange=toggle;$('calc').onclick=calc;$('clear').onclick=clearAll;$('clearHistory').onclick=()=>{localStorage.removeItem('history');render()};
$('lang').onclick=()=>{ar=!ar;localStorage.lang=ar?'ar':'en';lang()};['salary','mult','custom','hrs'].forEach(id=>$(id).addEventListener('input',save));
async function share(){let t=`OT Calculate\nSalary: ${$('salary').value} SAR\nMultiplier: ${$('mult').value==='custom'?$('custom').value:$('mult').value}×\nOT: ${$('hrs').value||0} hours\nTotal OT: ${$('total').textContent}`;if(navigator.share){try{await navigator.share({title:'OT Calculate',text:t})}catch(e){}}else{try{await navigator.clipboard.writeText(t);alert(ar?'تم نسخ النتيجة':'Result copied')}catch(e){}}}
$('share').onclick=share;$('home').onclick=()=>{if(promptEvent){promptEvent.prompt();promptEvent=null}else{$('modal').style.display='block'}};
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e});load();lang();
</script></body></html>
